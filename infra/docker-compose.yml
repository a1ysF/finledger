# Local development stack. Grows build by build (Kafka in Build 12, apps in Build 20).
# Settings come from infra/.env (git-ignored); copy infra/.env.example to start.
name: finledger

services:
  postgres:
    image: postgres:16-alpine
    container_name: finledger-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in infra/.env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in infra/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
    ports:
      - "5432:5432"          # laptop:container, so the app on the laptop uses localhost:5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container removal
    healthcheck:
      # $$ escapes $ for Compose, so the variable is read inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
